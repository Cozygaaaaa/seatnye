<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resto Direct Kasir</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🍽️ Menu Resto → Kasir</h1>
    <p>Input pesanan dari meja, langsung kirim ke antrian kasir.</p>
  </header>

  <main class="layout">
    <section class="panel menu-panel">
      <h2>Daftar Menu</h2>
      <div id="menuList" class="menu-grid"></div>
    </section>

    <section class="panel cart-panel">
      <h2>Pesanan Aktif</h2>
      <label>
        Nama Pelanggan
        <input id="customerName" type="text" placeholder="Contoh: Budi" />
      </label>
      <label>
        Nomor Meja
        <input id="tableNumber" type="text" placeholder="Contoh: 07" />
      </label>
      <label>
        Metode Bayar
        <select id="paymentMethod">
          <option value="Tunai">Tunai</option>
          <option value="QRIS">QRIS</option>
          <option value="Debit">Debit</option>
        </select>
      </label>

      <div id="cartItems" class="cart-items empty">Belum ada item.</div>
      <div class="total-row">
        <span>Total</span>
        <strong id="grandTotal">Rp0</strong>
      </div>

      <div class="cart-actions">
        <button id="clearCartBtn" class="secondary">Kosongkan</button>
        <button id="sendToCashierBtn" class="primary">Kirim ke Kasir</button>
      </div>
    </section>

    <section class="panel cashier-panel">
      <h2>Antrian Kasir</h2>
      <div id="cashierQueue" class="queue empty">Belum ada transaksi masuk.</div>
    </section>
  </main>

  <template id="menuCardTpl">
    <article class="menu-card">
      <img class="thumb" alt="" />
      <h3 class="name"></h3>
      <p class="desc"></p>
      <div class="card-footer">
        <span class="price"></span>
        <button class="add-btn">+ Tambah</button>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
