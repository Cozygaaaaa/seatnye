<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zayrion Tech</title>
  </head>
  <body>
    <main>
      <section class="hero hero-scroll-story" aria-labelledby="hero-title">
        <div class="hero-content hero-stage hero-stage--intro">
          <p class="hero-eyebrow">Futuristic Digital Systems</p>
          <h1 id="hero-title" class="hero-title">ZAYRION TECH</h1>
          <p class="hero-subheading">
            Build scalable digital systems for modern business
          </p>
          <nav class="hero-actions" aria-label="Primary actions">
            <a href="#" class="btn btn--primary hero-cta hero-cta--primary"
              >Get Started</a
            >
            <a href="#" class="btn btn--secondary hero-cta hero-cta--secondary"
              >View Our Work</a
            >
          </nav>
        </div>

        <div class="hero-bg" aria-hidden="true">
          <div class="grid-layer hero-stage hero-stage--grid-reveal"></div>

          <ul class="nodes-layer hero-stage hero-stage--nodes" role="list">
            <li class="node node--uiux" data-node="uiux">
              <span class="node-label">UI/UX Design</span>
            </li>
            <li class="node node--web" data-node="web-dev">
              <span class="node-label">Web Development</span>
            </li>
            <li class="node node--architecture" data-node="system-architecture">
              <span class="node-label">System Architecture</span>
            </li>
            <li class="node node--cloud" data-node="cloud-solutions">
              <span class="node-label">Cloud Solutions</span>
            </li>
            <li class="node node--security" data-node="data-security">
              <span class="node-label">Data Security</span>
            </li>
          </ul>

          <svg
            class="connections-layer hero-stage hero-stage--connections"
            viewBox="0 0 1000 1000"
            role="img"
            aria-label="System connection network"
            xmlns="http://www.w3.org/2000/svg"
          >
            <g class="connections-group">
              <line class="connection connection--uiux-to-core" x1="200" y1="250" x2="500" y2="500" />
              <line class="connection connection--web-to-core" x1="800" y1="250" x2="500" y2="500" />
              <line class="connection connection--architecture-to-core" x1="170" y1="600" x2="500" y2="500" />
              <line class="connection connection--cloud-to-core" x1="830" y1="600" x2="500" y2="500" />
              <line class="connection connection--security-to-core" x1="500" y1="820" x2="500" y2="500" />
            </g>
          </svg>

          <div class="core-system hero-stage hero-stage--core" data-core="central-system">
            <div class="core-system-ring core-system-ring--outer"></div>
            <div class="core-system-ring core-system-ring--inner"></div>
            <div class="core-system-center">
              <p class="core-system-label">Core System</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
