<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Booking - SeatNye Travel</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">SeatNye Travel</div>
        <nav>
          <a href="index.html">Home</a>
          <a href="search.html">Search Hotel</a>
          <a href="booking.html">My Booking</a>
        </nav>
      </div>
    </header>

    <main class="container dashboard-page">
      <section class="section-head">
        <h2>My Booking</h2>
        <a href="search.html">+ Buat Booking Baru</a>
      </section>

      <section class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Room</th><th>Stay</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="myBookingBody">
            <tr><td colspan="5">Loading...</td></tr>
          </tbody>
        </table>
      </section>

      <section class="card">
        <h3>Create Booking</h3>
        <form id="bookingForm">
          <input name="user_id" type="number" value="1" min="1" placeholder="User ID" required />
          <input name="guest_name" type="text" placeholder="Guest Name" required />
          <input name="room_id" id="roomIdInput" type="number" min="1" placeholder="Room ID" required />
          <label>Check-in <input name="checkin" type="date" required /></label>
          <label>Check-out <input name="checkout" type="date" required /></label>
          <button type="submit">Submit Booking</button>
        </form>
      </section>

      <pre id="bookingResult"></pre>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
