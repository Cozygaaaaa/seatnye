<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Partner Dashboard - SeatNye Travel</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <div class="brand">SeatNye Partner</div>
        <nav>
          <a href="index.html">Home</a>
          <a href="partner-dashboard.html">Dashboard</a>
        </nav>
      </div>
    </header>

    <main class="container dashboard-page">
      <section class="section-head"><h2>Hotel Partner Dashboard</h2><a href="#">+ Add Room</a></section>

      <section class="kpi-grid">
        <article class="kpi-card"><p>Room Occupancy</p><h3>78%</h3><span>Naik 5% minggu ini</span></article>
        <article class="kpi-card"><p>Today Booking</p><h3>24</h3><span>Realtime</span></article>
        <article class="kpi-card"><p>Revenue MTD</p><h3>$8,230</h3><span>Target 82%</span></article>
      </section>

      <section>
        <h3>Inventory Kamar</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Room Type</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead>
            <tbody>
              <tr><td>Deluxe Ocean</td><td>$120</td><td>8</td><td><span class="pill pill-blue">Available</span></td></tr>
              <tr><td>Family Suite</td><td>$180</td><td>2</td><td><span class="pill pill-yellow">Limited</span></td></tr>
              <tr><td>Business Room</td><td>$110</td><td>0</td><td><span class="pill pill-red">Sold Out</span></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
